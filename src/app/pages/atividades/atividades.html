<div class="container">

  <h1>Rotina Operacional</h1>

  <button class="btn-nova">
    Nova Atividade
  </button>

  <!-- FORMULÁRIO -->

  <div class="formulario">

    <input
  type="text"
  placeholder="Descrição"
  [(ngModel)]="novaAtividade.descricao">

<input
  type="text"
  placeholder="Status"
  [(ngModel)]="novaAtividade.status">

<input
  type="text"
  placeholder="Observação"
  [(ngModel)]="novaAtividade.observacao">

    <button (click)="salvar()">
        Salvar
    </button>

  </div>

  <p>{{ novaAtividade.descricao }}</p>
<p>{{ novaAtividade.status }}</p>
<p>{{ novaAtividade.observacao }}</p>

  <!-- LISTA DE ATIVIDADES -->

  <div class="card" *ngFor="let atividade of atividades">

    <h3>{{ atividade.descricao }}</h3>

    <p>
      Status: {{ atividade.status }}
    </p>

    <p>
      {{ atividade.observacao }}
    </p>

    <button class="btn-delete">
      Delete
    </button>

    <button class="btn-edit">
      Editar
    </button>

  </div>

</div>
